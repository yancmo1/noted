name: NotedTranscriber
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.shepswork
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  NotedTranscriber:
    type: application
    platform: macOS
    sources:
      - path: NotedTranscriber
    resources:
      - path: NotedTranscriber/Resources/Assets.xcassets
    info:
      path: NotedTranscriber/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted.transcriber
        PRODUCT_NAME: NotedTranscriber
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9PHS626XUN
  NotedTranscriberTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotedTranscriberTests
    dependencies:
      - target: NotedTranscriber
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted.transcriber.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9PHS626XUN
schemes:
  NotedTranscriber:
    build:
      targets:
        NotedTranscriber: all
        NotedTranscriberTests: [test]
    test:
      targets:
        - name: NotedTranscriberTests
