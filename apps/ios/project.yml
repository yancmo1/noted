name: Noted
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.shepswork
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Noted:
    type: application
    platform: iOS
    sources:
      - path: Noted
      - path: Shared
      - path: WatchConnectivity
    resources:
      - path: Noted/Resources/Assets.xcassets
    dependencies:
      - target: ShareExtension
        embed: true
      - target: Noted Watch Spike
        embed: true
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: Noted/Resources/Info.plist
      properties:
        CFBundleDisplayName: Noted
        API_BASE_URL: $(API_BASE_URL)
        NSMicrophoneUsageDescription: Noted needs microphone access to save meeting audio on this iPhone.
        NSLocalNetworkUsageDescription: Noted connects to your local Noted server to sync recordings.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted
        PRODUCT_NAME: Noted
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9PHS626XUN
        CODE_SIGN_ENTITLEMENTS: Noted/Resources/Noted.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
  Noted Watch Spike:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchRecorder
      - path: WatchConnectivity
    resources:
      - path: WatchRecorder/Assets.xcassets
      - path: WatchRecorder/AppIcon24x24@2x.png
      - path: WatchRecorder/AppIcon27.5x27.5@2x.png
      - path: WatchRecorder/AppIcon29x29@2x.png
      - path: WatchRecorder/AppIcon29x29@3x.png
      - path: WatchRecorder/AppIcon40x40@2x.png
      - path: WatchRecorder/AppIcon44x44@2x.png
      - path: WatchRecorder/AppIcon46x46@2x.png
      - path: WatchRecorder/AppIcon50x50@2x.png
      - path: WatchRecorder/AppIcon51x51@2x.png
      - path: WatchRecorder/AppIcon54x54@2x.png
      - path: WatchRecorder/AppIcon86x86@2x.png
      - path: WatchRecorder/AppIcon98x98@2x.png
      - path: WatchRecorder/AppIcon108x108@2x.png
      - path: WatchRecorder/AppIcon117x117@2x.png
      - path: WatchRecorder/AppIcon129x129@2x.png
    info:
      path: WatchRecorder/Info.plist
      properties:
        CFBundleDisplayName: Noted Spike
        CFBundleName: Noted Spike
        CFBundlePackageType: APPL
        CFBundleIconName: AppIcon
        CFBundleIconFiles:
          - AppIcon24x24@2x.png
          - AppIcon27.5x27.5@2x.png
          - AppIcon29x29@2x.png
          - AppIcon29x29@3x.png
          - AppIcon40x40@2x.png
          - AppIcon44x44@2x.png
          - AppIcon46x46@2x.png
          - AppIcon50x50@2x.png
          - AppIcon51x51@2x.png
          - AppIcon54x54@2x.png
          - AppIcon86x86@2x.png
          - AppIcon98x98@2x.png
          - AppIcon108x108@2x.png
          - AppIcon117x117@2x.png
          - AppIcon129x129@2x.png
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon24x24@2x.png
              - AppIcon27.5x27.5@2x.png
              - AppIcon29x29@2x.png
              - AppIcon29x29@3x.png
              - AppIcon40x40@2x.png
              - AppIcon44x44@2x.png
              - AppIcon46x46@2x.png
              - AppIcon50x50@2x.png
              - AppIcon51x51@2x.png
              - AppIcon54x54@2x.png
              - AppIcon86x86@2x.png
              - AppIcon98x98@2x.png
              - AppIcon108x108@2x.png
              - AppIcon117x117@2x.png
              - AppIcon129x129@2x.png
            CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Noted uses the Apple Watch microphone to validate reliable meeting capture.
        UIBackgroundModes:
          - audio
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.shepswork.noted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted.watchkitapp
        PRODUCT_NAME: Noted Watch Spike
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9PHS626XUN
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Noted
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAudioWithMaxCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted.share
        PRODUCT_NAME: Noted Share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9PHS626XUN
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
  NotedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NotedTests
    dependencies:
      - target: Noted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted.tests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9PHS626XUN
  NotedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NotedUITests
    dependencies:
      - target: Noted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shepswork.noted.uitests
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9PHS626XUN
schemes:
  Noted:
    build:
      targets:
        Noted: all
        ShareExtension: all
        Noted Watch Spike: [build]
        NotedTests: [test]
        NotedUITests: [test]
    test:
      targets:
        - name: NotedTests
        - name: NotedUITests
  Noted Watch Spike:
    build:
      targets:
        Noted Watch Spike: all
    run:
      config: Debug
